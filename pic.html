#op-diff {position:relative;color:var(--foreground)}
#op-diff svg {display:block;width:100%}
#op-diff svg text {fill:var(--foreground);font-size:12px}
#op-diff .domain,#op-diff .tick line {stroke:var(--border)}

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
const root=document.getElementById('op-diff'), host=root.querySelector('#op-chart');
const rates=[364,250,220,160,70,50];
function total(x,days,isNew){
 const limits=isNew?[35,45,65,85,150]:[30,40,60,80,150];
 const c=Math.min(days,isNew?22:25), n=x*days;
 let lo=0,sum=0;
 limits.concat(Infinity).forEach((hi,i)=>{sum+=Math.max(0,Math.min(n,hi*c)-lo*c)*rates[i];lo=hi;});
 return sum;
}
const data=[];
for(let day=1;day<=31;day++)for(let x=0;x<=150;x++){
 const old=total(x,day,false),now=total(x,day,true);
 data.push({x,day,old,now,z:now-old});
}
const fmt=d3.format(',d'), signed=d3.format('+,d');
const extent=d3.extent(data,d=>d.z), maxAbs=Math.max(...extent.map(Math.abs));
let selected=data.find(d=>d.x===60&&d.day===25), cursor;
function select(d){
 selected=d;
 root.querySelector('#op-detail').textContent=`${d.x} 人次／日 × ${d.day} 天＝${fmt(d.x*d.day)} 人次／月 ｜ 舊制 ${fmt(d.old)} 點 → 新制 ${fmt(d.now)} 點 ｜ 差額 ${signed(d.z)} 點`;
 if(cursor)cursor(d);
}
function fill(v){if(v===0)return 'var(--muted)';const pct=15+85*Math.abs(v)/maxAbs;return `color-mix(in srgb, var(${v>0?'--blue':'--orange'}) ${pct}%, var(--background))`;}
const legend=root.querySelector('#op-legend');
[-maxAbs,0,maxAbs].forEach(v=>{const item=document.createElement('span'), sw=document.createElement('i');sw.style.background=fill(v);item.append(sw,`${v===0?'0':signed(v)} 點`);legend.append(item);});
function draw(){
 const w=host.getBoundingClientRect().width;if(w<100)return;
 const h=480,m={l:68,r:18,t:15,b:65}, pw=w-m.l-m.r,ph=h-m.t-m.b;
 const xd=d3.extent(data,d=>d.x),yd=d3.extent(data,d=>d.day);
 const x=d3.scaleLinear().domain([xd[0]-.5,xd[1]+.5]).range([m.l,w-m.r]);
 const y=d3.scaleLinear().domain([yd[0]-.5,yd[1]+.5]).range([h-m.b,m.t]);
 host.replaceChildren();const svg=d3.select(host).append('svg').attr('viewBox',`0 0 ${w} ${h}`).attr('role','img').attr('aria-label','每日平均0至150人次、每月1至31天，新制減舊制每月診察費點數熱力圖');
 svg.append('desc').text('藍色為新制增加，橙色為減少，中性色為零。依每月總人次套用新舊制各段月合理量。');
 svg.append('g').selectAll('rect').data(data).join('rect').attr('x',d=>x(d.x-.5)).attr('y',d=>y(d.day+.5)).attr('width',pw/151+.1).attr('height',ph/31+.1).attr('fill',d=>fill(d.z));
 svg.append('rect').attr('data-chart-frame','').attr('x',m.l).attr('y',m.t).attr('width',pw).attr('height',ph).attr('fill','none').attr('stroke','var(--border)');
 const xticks=w<440?[0,50,100,150]:[0,15,30,45,60,75,90,105,120,135,150];
 svg.append('g').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(xticks).tickSizeOuter(0));
 svg.append('g').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).tickValues([1,5,10,15,20,22,25,28,31]).tickSizeOuter(0));
 [22.5,25.5].forEach(v=>svg.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(v)).attr('y2',y(v)).attr('stroke','var(--foreground)').attr('stroke-opacity',.35));
 svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(m.l+w-m.r)/2).attr('y',h-16).attr('text-anchor','middle').text('每日平均看診人次（人次／日）');
 svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(18,${m.t+ph/2}) rotate(-90)`).attr('text-anchor','middle').text('每月實際看診天數（天）');
 const mark=svg.append('rect').attr('fill','none').attr('stroke','var(--foreground)').attr('stroke-width',1.5).attr('pointer-events','none');
 cursor=d=>mark.attr('x',x(d.x-.5)).attr('y',y(d.day+.5)).attr('width',pw/151).attr('height',ph/31);
 svg.append('rect').attr('data-chart-hit','').attr('x',m.l).attr('y',m.t).attr('width',pw).attr('height',ph).attr('fill','transparent').on('pointermove click',function(event){const [px,py]=d3.pointer(event,this);const a=Math.max(0,Math.min(150,Math.round(x.invert(px)))),b=Math.max(1,Math.min(31,Math.round(y.invert(py))));select(data[(b-1)*151+a]);});
 select(selected);
 const labels=svg.selectAll('.tick text').nodes();let previous=null;
 labels.forEach(el=>{const b=el.getBoundingClientRect();if(previous&&b.y===previous.y&&b.x<previous.right+4){el.style.visibility='hidden';}else previous=b;});
}
new ResizeObserver(draw).observe(host);draw();
})();
</script>
